services:
  nginx:
    image: nginx:${NGINX_IMAGE_TAG}
    container_name: mattermost-nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    read_only: true
    tmpfs:
      - /var/run
      - /var/cache/nginx
      - /var/log/nginx
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "${HTTPS_PORT}:443"
      - "${HTTP_PORT}:80"
    networks:
      - mattermost
    depends_on:
      - mattermost

  mattermost:
    expose:
      - "8065"
    ports: []
    environment:
      - MM_SERVICESETTINGS_SITEURL=https://${DOMAIN}
